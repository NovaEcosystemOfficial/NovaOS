# Fedora Calamares + KIWI LiveOS: live root is exposed at /run/rootfsbase.
---
unpack:
    -   source: "/run/rootfsbase"
        sourcefs: "ext4"
        destination: ""
        exclude:
          - "/dev/*"
          - "/proc/*"
          - "/sys/*"
          - "/run/*"
          - "/tmp/*"
          - "/mnt/*"
          - "/media/*"
          - "/lost+found"
          - "/home/nova/.cache/*"
          - "/var/tmp/*"
          - "/var/cache/dnf/*"
          - "/var/lib/novaos/desktop.status"
          - "/var/lib/novaos/verify*"
