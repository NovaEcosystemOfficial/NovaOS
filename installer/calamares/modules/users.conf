---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - name: wheel
      must_exist: false
      system: true
    - name: video
      must_exist: false
      system: true
    - name: render
      must_exist: false
      system: true
    - name: audio
      must_exist: false
      system: true
    - name: input
      must_exist: false
      system: true
    # Access to /run/nova/update.sock (Nova Center / Nova Update clients)
    - name: nova
      must_exist: false
      system: true

# Package already ships %wheel sudoers via image; avoid duplicate drop-ins.
# sudoersGroup: wheel

sudoersConfigureWithGroup: true
setRootPassword: true
doReusePassword: true
doAutologin:     false

passwordRequirements:
    minLength: 6
    libpwquality:
        - minlen=6
        - minclass=0

allowWeakPasswords: true
allowWeakPasswordsDefault: true

user:
  shell: "/bin/bash"
  forbidden_names: [ root, nova, live ]
  home_permissions: "o700"

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "novaos-${login}"
  forbidden_names: [ localhost ]

allowActiveDirectory: false
