#
# Dual-boot friendly defaults:
# - no pre-selected erase
# - alongside / replace / manual available
# - ext4 default (simple dual-boot; btrfs selectable)
---
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    512MiB
    minimumSize:        100MiB
    label:              "NOVAOS_EFI"

userSwapChoices:
    - none
    - small
    - suspend
    - file

luksGeneration: luks1
drawNestedPartitions:   true
alwaysShowPartitionLabels: true
allowManualPartitioning:   true
initialPartitioningChoice: none
initialSwapChoice: none
defaultPartitionTableType: gpt
defaultFileSystemType:  "ext4"
availableFileSystemTypes:  ["ext4", "btrfs", "xfs"]

essentialMounts: [ "live-*", "control", "ventoy", "rootfsbase*" ]

lvm:
    enable: true

# Prefer a clear root (+ optional home via manual). EFI is prepended automatically.
partitionLayout:
    - name: "novaos_root"
      filesystem: "ext4"
      mountPoint: "/"
      size: 100%
