#
# NovaOS Calamares top-level settings (Milestone 0.2 — Installable).
# Canonical source: installer/calamares/settings.conf
# Synced into the live image at build time.
---
modules-search: [ local ]

instances:
- id:       postinstall
  module:   shellprocess
  config:   shellprocess-postinstall.conf
  weight:   10

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - locale
  - keyboard
  - localecfg
  - fstab
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - removeuser
  - dracut
  - grubcfg
  - bootloader
  - shellprocess@postinstall
  - umount
- show:
  - finished

branding: novaos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
