# NovaOS Wi-Fi defaults (NetworkManager)
# Keep backend on wpa_supplicant; enable reliable scans and autoconnect defaults.

[main]
# NetworkManager manages Wi-Fi via wpa_supplicant (D-Bus activation).

[device]
wifi.backend=wpa_supplicant
wifi.scan-rand-mac-address=yes

[connection]
# Saved Wi-Fi profiles reconnect at boot when the radio is available.
ipv6.ip6-privacy=0
