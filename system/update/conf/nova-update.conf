# Nova Update Broker — default configuration (Sprint 15)

[update]
# Active release channel: stable | beta | developer | nightly
channel = stable

# auto prefers dnf when available, otherwise mock
backend = auto

# Periodic check interval (daemon may honor in future supervisor loop)
check_interval_hours = 6

# Signature policy: off | warn | enforce
# Public releases must use enforce once production keys are shipped.
signature_policy = warn

socket_path = /run/nova/update.sock
state_dir = /var/lib/nova/update
repo_config_dir = /etc/yum.repos.d
keys_dir = /etc/pki/novaos

# Update classes to consider: os, nova, apps
enabled_classes = os,nova,apps
