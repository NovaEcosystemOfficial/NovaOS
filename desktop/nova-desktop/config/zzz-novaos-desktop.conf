[Autologin]
User=
Session=
Relogin=false

[General]
DisplayServer=x11
Numlock=none
# Disable Qt input method / virtual keyboard stack in the greeter.
GreeterEnvironment=QT_IM_MODULE=,QT_VIRTUALKEYBOARD_FORCE_DISABLE=1,QT_QPA_PLATFORM=xcb

[Theme]
Current=novaos

[X11]
SessionCommand=/usr/share/sddm/scripts/Xsession
Session=novaos-plasma.desktop
ServerArguments=-nolisten tcp

[Wayland]
# Prefer X11 greeter; Wayland Plasma greeter often forces virtual keyboard.
SessionCommand=/usr/share/sddm/scripts/wayland-session
CompositorCommand=
EnableHiDPI=true
