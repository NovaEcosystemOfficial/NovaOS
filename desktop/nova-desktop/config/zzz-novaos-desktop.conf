[Autologin]
User=
Session=
Relogin=false

[General]
DisplayServer=x11
Numlock=none
# Empty InputMethod is the SDDM-native kill switch for on-screen keyboard
# (qt6-qtvirtualkeyboard). GreeterEnvironment alone is not enough.
InputMethod=
GreeterEnvironment=QT_IM_MODULE=compose,QT_VIRTUALKEYBOARD_DESKTOP_DISABLE=1,QT_QPA_PLATFORM=xcb

[Theme]
Current=novaos

[X11]
SessionCommand=/usr/share/sddm/scripts/Xsession
Session=novaos-plasma.desktop
ServerArguments=-nolisten tcp

[Wayland]
# Prefer X11 greeter; Wayland Plasma greeter often forces virtual keyboard.
SessionCommand=/usr/share/sddm/scripts/wayland-session
CompositorCommand=
EnableHiDPI=true
